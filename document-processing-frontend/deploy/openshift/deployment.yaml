apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-processing-frontend
  labels:
    app.kubernetes.io/name: document-processing-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: document-processing-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-processing-frontend
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: image-registry.example.com/team/document-processing-frontend:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SOURCE_API_ORIGIN
              value: http://source-api:8000
            - name: CATALOG_API_ORIGIN
              value: http://catalog-api:8000
            - name: PROCESSING_API_ORIGIN
              value: http://processing-api:8000
            - name: CHAT_API_ORIGIN
              value: http://chat-api:8000
          volumeMounts:
            - name: runtime-config
              mountPath: /srv/config
              readOnly: true
            - name: runtime-writable
              mountPath: /var/lib/caddy-data
              subPath: data
            - name: runtime-writable
              mountPath: /var/lib/caddy-config
              subPath: config
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: runtime-config
          configMap:
            name: document-processing-frontend-config
        - name: runtime-writable
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: document-processing-frontend
spec:
  selector:
    app.kubernetes.io/name: document-processing-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: document-processing-frontend
spec:
  to:
    kind: Service
    name: document-processing-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
